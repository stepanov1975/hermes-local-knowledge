name: Automated release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Determine whether a release is needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_NOTES_SCRIPT: ${{ runner.temp }}/render-release-notes.py
          RELEASE_REQUIREMENTS_FILE: ${{ runner.temp }}/requirements-release.txt
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/tag-CHANGELOG.md
        run: |
          set -euo pipefail
          output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          version_at_commit() {
            python - "$1" <<'PY'
          import re
          import subprocess
          import sys
          import tomllib

          sha = sys.argv[1]

          def show(path: str) -> str:
              return subprocess.run(
                  ["git", "show", f"{sha}:{path}"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          project_version = tomllib.loads(show("pyproject.toml"))["project"]["version"]
          plugin_match = re.search(r"(?m)^version:\s*['\"]?([^\s'\"]+)", show("plugin.yaml"))
          package_match = re.search(
              r"(?m)^__version__\s*=\s*['\"]([^'\"]+)",
              show("hermes_local_knowledge/__init__.py"),
          )
          if plugin_match is None or package_match is None:
              raise SystemExit("Could not read all target version metadata")
          versions = {project_version, plugin_match.group(1), package_match.group(1)}
          if len(versions) != 1:
              raise SystemExit(f"Target version metadata is not synchronized: {sorted(versions)}")
          print(project_version)
          PY
          }
          cp requirements-release.txt "$RELEASE_REQUIREMENTS_FILE"
          version=$(python - <<'PY'
          import pathlib
          import re
          import tomllib

          root = pathlib.Path(".")
          project_version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          plugin_match = re.search(
              r"(?m)^version:\s*['\"]?([^\s'\"]+)",
              (root / "plugin.yaml").read_text(),
          )
          package_match = re.search(
              r"(?m)^__version__\s*=\s*['\"]([^'\"]+)",
              (root / "hermes_local_knowledge/__init__.py").read_text(),
          )
          if plugin_match is None or package_match is None:
              raise SystemExit("Could not read all version metadata")
          versions = {project_version, plugin_match.group(1), package_match.group(1)}
          if len(versions) != 1:
              raise SystemExit(f"Version metadata is not synchronized: {sorted(versions)}")
          print(project_version)
          PY
          )
          tag="v${version}"
          wheel="hermes_local_knowledge-${version}-py3-none-any.whl"
          sdist="hermes_local_knowledge-${version}.tar.gz"
          output "tag=${tag}" "wheel=${wheel}" "sdist=${sdist}"

          tag_exists=false
          expected_sha="$HEAD_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_exists=true
            expected_sha=$(git rev-list -n 1 "$tag")
            git show "${tag}:CHANGELOG.md" > "$TAG_CHANGELOG_FILE"
            git show "${tag}:scripts/render_release_notes.py" > "$RELEASE_NOTES_SCRIPT"
          else
            cp CHANGELOG.md "$TAG_CHANGELOG_FILE"
            cp scripts/render_release_notes.py "$RELEASE_NOTES_SCRIPT"
          fi
          notes_changelog="$TAG_CHANGELOG_FILE"

          python "$RELEASE_NOTES_SCRIPT" \
            --version "$version" \
            --changelog "$notes_changelog" \
            --output "$RELEASE_NOTES_FILE"

          release_ids=()
          page=1
          while :; do
            release_page=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")
            mapfile -t page_ids < <(
              jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' <<<"$release_page"
            )
            release_ids+=("${page_ids[@]}")
            page_count=$(jq 'length' <<<"$release_page")
            if (( page_count < 100 )); then
              break
            fi
            ((page += 1))
          done
          if (( ${#release_ids[@]} > 1 )); then
            echo "Multiple releases claim ${tag}; refusing ambiguous repair." >&2
            exit 1
          fi

          if (( ${#release_ids[@]} == 1 )); then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_ids[0]}" | jq '{
              isImmutable: (.immutable // false),
              isDraft: .draft,
              isPrerelease: .prerelease,
              assets: .assets,
              body: .body,
              targetCommitish: .target_commitish
            }' > "$RELEASE_JSON_FILE"
            release_is_draft=$(jq -r '.isDraft' "$RELEASE_JSON_FILE")
            release_is_immutable=$(jq -r '.isImmutable' "$RELEASE_JSON_FILE")
            release_is_prerelease=$(jq -r '.isPrerelease' "$RELEASE_JSON_FILE")
            release_target=$(jq -r '.targetCommitish' "$RELEASE_JSON_FILE")
            output \
              "release_exists=true" \
              "release_is_draft=${release_is_draft}" \
              "release_is_immutable=${release_is_immutable}" \
              "release_is_prerelease=${release_is_prerelease}"

            if [[ "$release_is_draft" == true ]]; then
              recover_tag=false
              if [[ "$tag_exists" == false ]]; then
                if [[ ! "$release_target" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "Untagged draft release ${tag} has non-immutable target ${release_target}." >&2
                  exit 1
                fi
                expected_sha="$release_target"
                recover_tag=true
              elif [[ "$release_target" =~ ^[0-9a-f]{40}$ && "$release_target" != "$expected_sha" ]]; then
                echo "Draft release ${tag} targets ${release_target}, not tag commit ${expected_sha}." >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$expected_sha" "$HEAD_SHA"; then
                echo "Draft release ${tag} target ${expected_sha} is not an ancestor of ${HEAD_SHA}." >&2
                exit 1
              fi
              target_version=$(version_at_commit "$expected_sha")
              if [[ "$target_version" != "$version" ]]; then
                echo "Draft release ${tag} target version ${target_version} does not match ${version}." >&2
                exit 1
              fi
              if [[ "$recover_tag" == true ]]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f ref="refs/tags/${tag}" \
                  -f sha="$expected_sha" >/dev/null
                git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
                actual_sha=$(git rev-parse "${tag}^{commit}")
                if [[ "$actual_sha" != "$expected_sha" ]]; then
                  echo "Recovered draft tag ${tag} points to ${actual_sha}, not ${expected_sha}." >&2
                  exit 1
                fi
                tag_exists=true
                git show "${expected_sha}:CHANGELOG.md" > "$TAG_CHANGELOG_FILE"
                git show "${expected_sha}:scripts/render_release_notes.py" > "$RELEASE_NOTES_SCRIPT"
                python "$RELEASE_NOTES_SCRIPT" \
                  --version "$version" \
                  --changelog "$notes_changelog" \
                  --output "$RELEASE_NOTES_FILE"
              fi
            fi

            release_state=$(python "$RELEASE_NOTES_SCRIPT" \
              --version "$version" \
              --changelog "$notes_changelog" \
              --output "$RELEASE_NOTES_FILE" \
              --release-json "$RELEASE_JSON_FILE" \
              --expected-wheel "$wheel" \
              --expected-sdist "$sdist" \
              --inspect-release)
            build_needed=$(jq -r '.build_needed' <<<"$release_state")
            needed=$(jq -r '.needed' <<<"$release_state")

            if [[ "$release_is_draft" == true ]]; then
              # Draft assets are still mutable. Rebuild and replace them from
              # the verified commit before publication, regardless of names/sizes.
              build_needed=true
              needed=true
            fi
            output "tag_exists=${tag_exists}" "expected_sha=${expected_sha}"
            if [[ "$release_is_immutable" == true && "$build_needed" == true ]]; then
              echo "Immutable release ${tag} is missing an expected asset and cannot be repaired." >&2
              exit 1
            fi
            if [[ "$needed" == false ]]; then
              echo "Release ${tag} is already complete and matches CHANGELOG.md."
              output "needed=false" "build_needed=false"
            else
              echo "Release ${tag} requires repair."
              output "needed=true" "build_needed=${build_needed}"
            fi
            exit 0
          fi

          output \
            "tag_exists=${tag_exists}" \
            "release_exists=false" \
            "release_is_draft=false" \
            "release_is_immutable=false" \
            "release_is_prerelease=false" \
            "expected_sha=${expected_sha}" \
            "needed=true" \
            "build_needed=true"
          if [[ "$tag_exists" == true && "$expected_sha" != "$HEAD_SHA" ]]; then
            echo "Tag ${tag} points to ${expected_sha}, not verified commit ${HEAD_SHA}." >&2
            exit 1
          fi

      - name: Check out verified source for release build or repair
        if: >-
          steps.release.outputs.build_needed == 'true' &&
          (steps.release.outputs.tag_exists == 'true' ||
          steps.release.outputs.release_is_draft == 'true')
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
        run: git checkout --detach "$EXPECTED_SHA"

      - name: Build and verify release artifacts
        if: steps.release.outputs.build_needed == 'true'
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/requirements-release.txt
          RELEASE_REQUIREMENTS_FILE: ${{ runner.temp }}/requirements-release.txt
        run: |
          set -euo pipefail
          python -m pip install --requirement "$RELEASE_REQUIREMENTS_FILE"
          python -m build --outdir dist
          python -m twine check dist/*
          python scripts/verify_release_artifacts.py --sdist dist/*.tar.gz

          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_root=$(mktemp -d /tmp/release-smoke.XXXXXX)
            python -m venv "$smoke_root/venv"
            mkdir "$smoke_root/empty"
            "$smoke_root/venv/bin/python" -m pip install "$artifact"
            (
              cd "$smoke_root/empty"
              env -u PYTHONPATH -u VIRTUAL_ENV \
                "$smoke_root/venv/bin/python" -I \
                "$GITHUB_WORKSPACE/scripts/verify_release_artifacts.py" --installed-smoke
            )
            rm -rf "$smoke_root"
          done

      - name: Upload repaired release artifacts
        if: >-
          steps.release.outputs.build_needed == 'true' &&
          steps.release.outputs.release_exists == 'true'
        env:
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/$EXPECTED_WHEEL" \
            "dist/$EXPECTED_SDIST" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Repair GitHub release metadata and notes
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES_FILE"

      - name: Repair prerelease status
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'true' &&
          steps.release.outputs.release_is_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false

      - name: Create GitHub release from existing tag
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false' &&
          steps.release.outputs.tag_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES_FILE"

      - name: Create tag and GitHub release
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false' &&
          steps.release.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$HEAD_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES_FILE"

      - name: Upload new draft release artifacts
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false'
        env:
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/$EXPECTED_WHEEL" \
            "dist/$EXPECTED_SDIST" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify draft tag target
        if: >-
          steps.release.outputs.needed == 'true' &&
          (steps.release.outputs.release_exists == 'false' ||
          steps.release.outputs.release_is_draft == 'true')
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$EXPECTED_SHA" >/dev/null
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_sha=$(git rev-parse "${RELEASE_TAG}^{commit}")
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Draft release tag ${RELEASE_TAG} points to ${actual_sha}, not ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Verify draft release content
        if: >-
          steps.release.outputs.needed == 'true' &&
          (steps.release.outputs.release_exists == 'false' ||
          steps.release.outputs.release_is_draft == 'true')
        env:
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release-draft.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_NOTES_SCRIPT: ${{ runner.temp }}/render-release-notes.py
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/tag-CHANGELOG.md
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,body > "$RELEASE_JSON_FILE"
          jq -e '.isDraft == true and .isPrerelease == false' "$RELEASE_JSON_FILE" >/dev/null
          release_state=$(python "$RELEASE_NOTES_SCRIPT" \
            --version "${RELEASE_TAG#v}" \
            --changelog "$TAG_CHANGELOG_FILE" \
            --output "$RELEASE_NOTES_FILE" \
            --release-json "$RELEASE_JSON_FILE" \
            --expected-wheel "$EXPECTED_WHEEL" \
            --expected-sdist "$EXPECTED_SDIST" \
            --inspect-release)
          jq -e '.assets_complete and .notes_match' <<<"$release_state" >/dev/null

      - name: Publish verified draft release
        if: >-
          steps.release.outputs.needed == 'true' &&
          (steps.release.outputs.release_exists == 'false' ||
          steps.release.outputs.release_is_draft == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false

      - name: Verify published release
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release-final.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_NOTES_SCRIPT: ${{ runner.temp }}/render-release-notes.py
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/tag-CHANGELOG.md
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,body > "$RELEASE_JSON_FILE"
          python "$RELEASE_NOTES_SCRIPT" \
            --version "${RELEASE_TAG#v}" \
            --changelog "$TAG_CHANGELOG_FILE" \
            --output "$RELEASE_NOTES_FILE" \
            --release-json "$RELEASE_JSON_FILE" \
            --expected-wheel "$EXPECTED_WHEEL" \
            --expected-sdist "$EXPECTED_SDIST" \
            --verify-complete

          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Published tag points to ${tag_sha}, expected ${EXPECTED_SHA}." >&2
            exit 1
          fi
