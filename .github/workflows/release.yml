name: Automated release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out verified commit
        # actions/checkout v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Determine whether a release is needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          version=$(python - <<'PY'
          import pathlib
          import re
          import tomllib

          root = pathlib.Path(".")
          project_version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          plugin_match = re.search(
              r"(?m)^version:\s*['\"]?([^\s'\"]+)",
              (root / "plugin.yaml").read_text(),
          )
          package_match = re.search(
              r"(?m)^__version__\s*=\s*['\"]([^'\"]+)",
              (root / "hermes_local_knowledge/__init__.py").read_text(),
          )
          if plugin_match is None or package_match is None:
              raise SystemExit("Could not read all version metadata")
          versions = {project_version, plugin_match.group(1), package_match.group(1)}
          if len(versions) != 1:
              raise SystemExit(f"Version metadata is not synchronized: {sorted(versions)}")
          print(project_version)
          PY
          )
          tag="v${version}"
          wheel="hermes_local_knowledge-${version}-py3-none-any.whl"
          sdist="hermes_local_knowledge-${version}.tar.gz"
          output "tag=${tag}" "wheel=${wheel}" "sdist=${sdist}"

          release_json=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets 2>/dev/null || true)
          if [[ -n "$release_json" ]]; then
            git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_sha=$(git rev-list -n 1 "$tag")
            output \
              "tag_exists=true" \
              "release_exists=true" \
              "expected_sha=${tag_sha}"

            if jq -e --arg wheel "$wheel" --arg sdist "$sdist" '
              (.isDraft == false) and
              (.isPrerelease == false) and
              ([.assets[] | select(
                .name == $wheel and .state == "uploaded" and .size > 0
              )] | length == 1) and
              ([.assets[] | select(
                .name == $sdist and .state == "uploaded" and .size > 0
              )] | length == 1)
            ' <<<"$release_json" >/dev/null; then
              echo "Release ${tag} is already published with both artifacts."
              output "needed=false"
            else
              echo "Release ${tag} is incomplete; rebuilding its tagged source for repair."
              output "needed=true"
            fi
            exit 0
          fi

          output "release_exists=false" "needed=true"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tag_sha" != "$HEAD_SHA" ]]; then
              echo "Tag ${tag} points to ${tag_sha}, not verified commit ${HEAD_SHA}." >&2
              exit 1
            fi
            output "tag_exists=true" "expected_sha=${tag_sha}"
          else
            output "tag_exists=false" "expected_sha=${HEAD_SHA}"
          fi

      - name: Check out tagged source for release repair
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$RELEASE_TAG"

      - name: Build and verify release artifacts
        if: steps.release.outputs.needed == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          python -m twine check dist/*

          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_dir=$(mktemp -d /tmp/release-smoke.XXXXXX)
            python -m venv "$smoke_dir"
            "$smoke_dir/bin/python" -m pip install "$artifact"
            "$smoke_dir/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import hermes_local_knowledge.okf as okf

          entries = [
              entry
              for entry in metadata.entry_points().select(group="hermes_agent.plugins")
              if entry.name == "local_knowledge"
          ]
          if len(entries) != 1:
              raise SystemExit(f"Expected one local_knowledge entry point, found {entries!r}")
          module = entries[0].load()
          if not callable(getattr(module, "register", None)):
              raise SystemExit("Plugin register entry point is not callable")
          if not callable(getattr(okf, "run_worker", None)):
              raise SystemExit("Packaged OKF worker entry point is not callable")
          PY
            rm -rf "$smoke_dir"
          done

      - name: Repair incomplete GitHub release
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --title "$RELEASE_TAG"

      - name: Create GitHub release from existing tag
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false' &&
          steps.release.outputs.tag_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes; then
            echo "Release creation failed; final verification will reject partial publication." >&2
          fi

      - name: Create tag and GitHub release
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false' &&
          steps.release.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes; then
            echo "Release creation failed; final verification will reject partial publication." >&2
          fi

      - name: Verify published release
        if: steps.release.outputs.needed == 'true'
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets)
          jq -e --arg wheel "$EXPECTED_WHEEL" --arg sdist "$EXPECTED_SDIST" '
            (.isDraft == false) and
            (.isPrerelease == false) and
            ([.assets[] | select(
              .name == $wheel and .state == "uploaded" and .size > 0
            )] | length == 1) and
            ([.assets[] | select(
              .name == $sdist and .state == "uploaded" and .size > 0
            )] | length == 1)
          ' <<<"$release_json" >/dev/null

          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Published tag points to ${tag_sha}, expected ${EXPECTED_SHA}." >&2
            exit 1
          fi
