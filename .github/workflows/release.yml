name: Automated release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Determine whether a release is needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release.json
          RELEASE_LOOKUP_ERROR_FILE: ${{ runner.temp }}/release-lookup-error.txt
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_NOTES_SCRIPT: ${{ runner.temp }}/render-release-notes.py
          RELEASE_REQUIREMENTS_FILE: ${{ runner.temp }}/requirements-release.txt
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/tag-CHANGELOG.md
        run: |
          set -euo pipefail
          output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          cp requirements-release.txt "$RELEASE_REQUIREMENTS_FILE"
          version=$(python - <<'PY'
          import pathlib
          import re
          import tomllib

          root = pathlib.Path(".")
          project_version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          plugin_match = re.search(
              r"(?m)^version:\s*['\"]?([^\s'\"]+)",
              (root / "plugin.yaml").read_text(),
          )
          package_match = re.search(
              r"(?m)^__version__\s*=\s*['\"]([^'\"]+)",
              (root / "hermes_local_knowledge/__init__.py").read_text(),
          )
          if plugin_match is None or package_match is None:
              raise SystemExit("Could not read all version metadata")
          versions = {project_version, plugin_match.group(1), package_match.group(1)}
          if len(versions) != 1:
              raise SystemExit(f"Version metadata is not synchronized: {sorted(versions)}")
          print(project_version)
          PY
          )
          tag="v${version}"
          wheel="hermes_local_knowledge-${version}-py3-none-any.whl"
          sdist="hermes_local_knowledge-${version}.tar.gz"
          output "tag=${tag}" "wheel=${wheel}" "sdist=${sdist}"

          tag_exists=false
          expected_sha="$HEAD_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_exists=true
            expected_sha=$(git rev-list -n 1 "$tag")
            git show "${tag}:CHANGELOG.md" > "$TAG_CHANGELOG_FILE"
            git show "${tag}:scripts/render_release_notes.py" > "$RELEASE_NOTES_SCRIPT"
          else
            cp CHANGELOG.md "$TAG_CHANGELOG_FILE"
            cp scripts/render_release_notes.py "$RELEASE_NOTES_SCRIPT"
          fi
          notes_changelog="$TAG_CHANGELOG_FILE"
          output "tag_exists=${tag_exists}" "expected_sha=${expected_sha}"

          python "$RELEASE_NOTES_SCRIPT" \
            --version "$version" \
            --changelog "$notes_changelog" \
            --output "$RELEASE_NOTES_FILE"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            >/dev/null 2>"$RELEASE_LOOKUP_ERROR_FILE"; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isImmutable,isDraft,isPrerelease,assets,body > "$RELEASE_JSON_FILE"
            release_is_draft=$(jq -r '.isDraft' "$RELEASE_JSON_FILE")
            release_is_immutable=$(jq -r '.isImmutable' "$RELEASE_JSON_FILE")
            release_is_prerelease=$(jq -r '.isPrerelease' "$RELEASE_JSON_FILE")
            output \
              "release_exists=true" \
              "release_is_draft=${release_is_draft}" \
              "release_is_immutable=${release_is_immutable}" \
              "release_is_prerelease=${release_is_prerelease}"
            release_state=$(python "$RELEASE_NOTES_SCRIPT" \
              --version "$version" \
              --changelog "$notes_changelog" \
              --output "$RELEASE_NOTES_FILE" \
              --release-json "$RELEASE_JSON_FILE" \
              --expected-wheel "$wheel" \
              --expected-sdist "$sdist" \
              --inspect-release)
            build_needed=$(jq -r '.build_needed' <<<"$release_state")
            needed=$(jq -r '.needed' <<<"$release_state")

            if [[ "$release_is_immutable" == true && "$build_needed" == true ]]; then
              echo "Immutable release ${tag} is missing an expected asset and cannot be repaired." >&2
              exit 1
            fi
            if [[ "$needed" == false ]]; then
              echo "Release ${tag} is already complete and matches CHANGELOG.md."
              output "needed=false" "build_needed=false"
            else
              echo "Release ${tag} requires repair."
              output "needed=true" "build_needed=${build_needed}"
            fi
            exit 0
          fi

          release_lookup_error=$(<"$RELEASE_LOOKUP_ERROR_FILE")
          if [[ "$release_lookup_error" != *"(HTTP 404)"* ]]; then
            printf '%s\n' "$release_lookup_error" >&2
            exit 1
          fi

          output \
            "release_exists=false" \
            "release_is_draft=false" \
            "release_is_immutable=false" \
            "release_is_prerelease=false" \
            "needed=true" \
            "build_needed=true"
          if [[ "$tag_exists" == true && "$expected_sha" != "$HEAD_SHA" ]]; then
            echo "Tag ${tag} points to ${expected_sha}, not verified commit ${HEAD_SHA}." >&2
            exit 1
          fi

      - name: Check out tagged source for release build or repair
        if: >-
          steps.release.outputs.build_needed == 'true' &&
          steps.release.outputs.tag_exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$RELEASE_TAG"

      - name: Build and verify release artifacts
        if: steps.release.outputs.build_needed == 'true'
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/requirements-release.txt
          RELEASE_REQUIREMENTS_FILE: ${{ runner.temp }}/requirements-release.txt
        run: |
          set -euo pipefail
          python -m pip install --requirement "$RELEASE_REQUIREMENTS_FILE"
          python -m build --outdir dist
          python -m twine check dist/*

          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_dir=$(mktemp -d /tmp/release-smoke.XXXXXX)
            python -m venv "$smoke_dir"
            "$smoke_dir/bin/python" -m pip install "$artifact"
            "$smoke_dir/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import hermes_local_knowledge.okf as okf

          entries = [
              entry
              for entry in metadata.entry_points().select(group="hermes_agent.plugins")
              if entry.name == "local_knowledge"
          ]
          if len(entries) != 1:
              raise SystemExit(f"Expected one local_knowledge entry point, found {entries!r}")
          module = entries[0].load()
          if not callable(getattr(module, "register", None)):
              raise SystemExit("Plugin register entry point is not callable")
          if not callable(getattr(okf, "run_worker", None)):
              raise SystemExit("Packaged OKF worker entry point is not callable")
          PY
            rm -rf "$smoke_dir"
          done

      - name: Upload repaired release artifacts
        if: >-
          steps.release.outputs.build_needed == 'true' &&
          steps.release.outputs.release_exists == 'true'
        env:
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/$EXPECTED_WHEEL" \
            "dist/$EXPECTED_SDIST" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Repair GitHub release metadata and notes
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES_FILE"

      - name: Repair prerelease status
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'true' &&
          steps.release.outputs.release_is_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false

      - name: Create GitHub release from existing tag
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false' &&
          steps.release.outputs.tag_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES_FILE"

      - name: Create tag and GitHub release
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false' &&
          steps.release.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$HEAD_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES_FILE"

      - name: Upload new draft release artifacts
        if: >-
          steps.release.outputs.needed == 'true' &&
          steps.release.outputs.release_exists == 'false'
        env:
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/$EXPECTED_WHEEL" \
            "dist/$EXPECTED_SDIST" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify draft tag target
        if: >-
          steps.release.outputs.needed == 'true' &&
          (steps.release.outputs.release_exists == 'false' ||
          steps.release.outputs.release_is_draft == 'true')
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_sha=$(git rev-parse "${RELEASE_TAG}^{commit}")
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Draft release tag ${RELEASE_TAG} points to ${actual_sha}, not ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Verify draft release content
        if: >-
          steps.release.outputs.needed == 'true' &&
          (steps.release.outputs.release_exists == 'false' ||
          steps.release.outputs.release_is_draft == 'true')
        env:
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release-draft.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_NOTES_SCRIPT: ${{ runner.temp }}/render-release-notes.py
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/tag-CHANGELOG.md
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,body > "$RELEASE_JSON_FILE"
          jq -e '.isDraft == true and .isPrerelease == false' "$RELEASE_JSON_FILE" >/dev/null
          release_state=$(python "$RELEASE_NOTES_SCRIPT" \
            --version "${RELEASE_TAG#v}" \
            --changelog "$TAG_CHANGELOG_FILE" \
            --output "$RELEASE_NOTES_FILE" \
            --release-json "$RELEASE_JSON_FILE" \
            --expected-wheel "$EXPECTED_WHEEL" \
            --expected-sdist "$EXPECTED_SDIST" \
            --inspect-release)
          jq -e '.assets_complete and .notes_match' <<<"$release_state" >/dev/null

      - name: Publish verified draft release
        if: >-
          steps.release.outputs.needed == 'true' &&
          (steps.release.outputs.release_exists == 'false' ||
          steps.release.outputs.release_is_draft == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false

      - name: Verify published release
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          EXPECTED_SDIST: ${{ steps.release.outputs.sdist }}
          EXPECTED_WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release-final.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_NOTES_SCRIPT: ${{ runner.temp }}/render-release-notes.py
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAG_CHANGELOG_FILE: ${{ runner.temp }}/tag-CHANGELOG.md
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,body > "$RELEASE_JSON_FILE"
          python "$RELEASE_NOTES_SCRIPT" \
            --version "${RELEASE_TAG#v}" \
            --changelog "$TAG_CHANGELOG_FILE" \
            --output "$RELEASE_NOTES_FILE" \
            --release-json "$RELEASE_JSON_FILE" \
            --expected-wheel "$EXPECTED_WHEEL" \
            --expected-sdist "$EXPECTED_SDIST" \
            --verify-complete

          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Published tag points to ${tag_sha}, expected ${EXPECTED_SHA}." >&2
            exit 1
          fi
