name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-scan:
    name: Hermes plugin security scan
    runs-on: ubuntu-latest
    env:
      # The scanner is imported and executed below, so keep its upstream source immutable.
      HERMES_PLUGIN_SCANNER_REF: 64cc87e6681a3db4e158ed8b999ff77ba0b9d28a

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check pinned Hermes plugin scanner
        run: |
          scanner_root="$RUNNER_TEMP/hermes-agent-scanner"
          git init -q "$scanner_root"
          git -C "$scanner_root" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$scanner_root" fetch --depth 1 origin "$HERMES_PLUGIN_SCANNER_REF"
          git -C "$scanner_root" -c advice.detachedHead=false checkout --detach FETCH_HEAD
          PYTHONPATH="$scanner_root" python scripts/check_plugin_scan.py

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hermes-agent
          python -m pip install -e '.[test]'
          hermes --version

      - name: Run tests
        run: python -m pytest -q

  quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hermes-agent
          python -m pip install -e '.[test]'
          hermes --version

      - name: Check version policy
        env:
          VERSION_POLICY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_version_policy.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

  windows-tests:
    name: Windows Python 3.12
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hermes-agent
          python -m pip install -e '.[test]'
          hermes --version

      - name: Run tests
        run: python -m pytest -q

  release:
    name: Publish new version
    needs: [plugin-scan, quality, tests, windows-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
